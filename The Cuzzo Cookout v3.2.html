<script>
function handleSubmit(e) {
  e.preventDefault();
  var emailInput = document.getElementById('emailInput');
  var phoneInput = document.getElementById('phoneInput');
  var msg = document.getElementById('formMsg');
  var email = emailInput.value.trim();
  var phone = phoneInput.value.trim();
  if (!email && !phone) {
    msg.style.color = '#e02020';
    msg.textContent = 'Enter your email, phone, or both.';
    return false;
  }
  if (email && !email.includes('@')) {
    msg.style.color = '#e02020';
    msg.textContent = 'Please enter a valid email address.';
    return false;
  }
  msg.style.color = 'rgba(255,255,255,0.5)';
  msg.textContent = 'Sending...';
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfO6FBeLLXEVrbN7pIlcyOn5OvXqea3Tbb74lFs8FOJBkHHR9XxEIx-JXl7XvHD6-o/exec';
  fetch(SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, phone: phone, date: new Date().toISOString() })
  }).then(function() {
    emailInput.value = '';
    phoneInput.value = '';
    msg.style.color = '#ffffff';
    msg.textContent = 'Domino! Follow us & say hey on Instagram \u2192 @thecuzzocookout';
  }).catch(function() {
    msg.style.color = '#e02020';
    msg.textContent = 'Something went wrong. Try again.';
  });
  return false;
}
</script>
